[build-system]
requires = [
    "cmake>=3.18",
    "ninja>=1.11",
    "pybind11>=2.12",
    "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "coopinfer"
version = "0.1.0"
description = "Host-device cooperative inference scheduling prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "cmake>=3.18",
    "ninja>=1.11",
    "pytest>=7.0",
    "pybind11>=2.12",
    "scikit-build-core>=0.10",
]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["src/coopinfer"]

[project.scripts]
coopinfer = "coopinfer.app:main"
