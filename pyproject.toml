[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coopinfer"
version = "0.1.0"
description = "Host-device cooperative inference scheduling prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.6",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
coopinfer = "coopinfer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
